      - "调整 Quick AI 对话持久化或继续历史对话。"
      - "实现未来主应用对话历史读取。"
    notes: "复用 v2 会话表、消息自增 ID 与 UNIQUE(conversation_id, sequence)；SQLite v9 为既有会话表增加不可变 origin（overlay/main/legacy）及来源更新时间索引，v10 一次性删除无法可靠追溯且仅用于测试的 legacy 会话并依赖外键级联清理消息；新建必须显式写入 overlay 或 main。仓库支持按来源查询最近/全部有标题会话、按 ID 重命名和级联删除；导出从数据库快照按 sequence 顺序写出完整 user/assistant Markdown。prepare_turn 先独立提交 pending user；complete_turn 只在匹配的 user ID/expected sequence 后补 assistant，完成轮次重试直接返回权威快照，旧版本或并发冲突拒绝写入。"
    risk: "不要把 Quick AI 消息写入 learning_records；不实现长期记忆、回答重生成、检索增强或第二套会话存储。"

  - path: "src-tauri/src/quick_ai.rs"
    purpose: "Quick AI 多轮 DeepSeek 请求、上下文装配和 Tauri commands。"
    status: "active"
    read_when:
      - "调整 Quick AI system prompt、上下文窗口或发送流程。"
      - "排查 create/get/send/list_recent/list_all/rename/delete/export Quick AI commands。"
    notes: "独立于 ExplanationCard JSON 协议；create command 要求 overlay/main 创建来源，recent/all commands 可按来源过滤，主窗口不传过滤时读取全部来源。管理和导出 commands 始终携带数据库 conversationId，export 在用户选定路径后重新读取权威快照再写文件。send command 要求已创建的 conversationId 和 expectedUserSequence，先 prepare pending user，再从该 SQLite 快照装配多轮上下文并以 quick_ai 分类调用共享模型边界，成功后 complete assistant；已完成轮次不会再次请求模型或重复统计。"
    risk: "不接学习记录检索、工具调用、联网搜索、长期记忆或通用 Agent 框架。"

  - path: "src-tauri/src/writing.rs"
    purpose: "阶段五写作 SQLite repository、结构化 DeepSeek 分析/问答和 Tauri commands。"
    status: "active"
    read_when:
      - "调整写作文章 CRUD、搜索、revision、版本、分析或问答。"
      - "排查写作保存/模型失败、过期结果拒绝或 schema validator。"
    notes: "复用 readray.sqlite3 与 deepseek_client；文章、草稿、完成稿、不可变版本、对比基线、分析和问答均由数据库生成 ID/时间。分析保存会原子推进 revision；activeAnalysis 只读取当前 revision，baselineAnalysis 按 comparison_baseline_revision 独立恢复。完成与分析使用写事务串行化，同一 expectedRevision 只能有一方提交；完成版本在同一事务中固化 source revision，以及同一检查基线绑定的 analysis/baseline revision、问题和模式，检查后编辑时 source 可晚于二者。legacy comparison_baseline_revision 为 null 时，只读取与 expectedRevision 精确匹配的分析并保存其 analysisRevision，未知基线仍保持 null。当前草稿追问允许引用最近完成版本之后同一草稿会话的旧 revision 回答，并沿 parentAnswerId 向模型提供同一可见身份内最近 8 条有序问答；历史问答仍按 versionId 使用屏幕所见不可变正文，跨边界链路拒绝调用模型。分析提示词只允许从本文真实问题提炼最多 4 个高价值可迁移写作要点，不枚举好词好句；validator 只接受正文中可定位、source 与 targetText 可验证的原文。"
    risk: "不得写入 learning_records/quick_ai 表、跨 await 持有 SQLite 事务、建立第二套模型客户端或让未校验 JSON 进入前端。"

  - path: "src-tauri/src/learning_records.rs"
    purpose: "阶段三 SQLite 学习事件迁移、Rust 存储边界和 Tauri 数据 commands。"
    status: "active"
    read_when:
      - "调整学习记录 schema、迁移或存储字段。"
      - "实现学习记录窗口、搜索、筛选、单条读取或删除。"
      - "排查自动保存或应用数据目录中的 SQLite 问题。"
    notes: "使用 rusqlite bundled；v1～v16 保持既有学习记录、Quick AI、写作、usage、偏好、主题、来源与复习 schema。v17 追加 learning_record_targets 伴生投影，保存新事件时在同一事务写入 queryDirection/learningTargetText；v18 追加 explanation_card_cache，缓存 repository 由 explanation_cache.rs 负责。升级只为可靠旧英文 query 确定性回填，旧中文不调用模型、不猜译文且原始事件继续保留。list/search/get/Today 在 SQL 层联结投影，分页与计数一致；搜索匹配英文目标及原始 query/context。"
    risk: "learning_records 继续只做不可修改的原始事件，不做去重或覆盖；复习状态必须留在独立表，新增 schema 继续追加 migration，不能改写已发布迁移。"

  - path: "src-tauri/src/review.rs"
    purpose: "阶段八 SQLite 复习仓库、连续分页 Feed、AI 英文语境持久化、调度、结果/撤销、质量反馈和 typed Tauri commands。"
    status: "active"
    read_when:
      - "调整 Feed 候选/轮次、语境生成、调度间隔、attempt、幂等或 revision 事务。"
      - "调整卡片质量反馈保存、补充详情或撤销。"
    notes: "按本机日历持久化无硬上限游标 Feed；候选、已保存页、统计与 canContinue 均联结 learning_record_targets，旧中文或其他无可靠英文目标的原始事件不会进入 Feed，也不会造成分页不足。制卡 Prompt、英文语境包含校验和卡片目标统一使用 learningTargetText，queryText 只保留为来源。既有轮次、缓存池、退避、调度、attempt/撤销、质量反馈和条目级权威对账语义保持不变。"
    risk: "不得按 normalized_text 合并、修改 learning_records、让质量反馈改变学习结果、跨事务制造重复 attempt，或把本阶段扩展到写作/对话/长期学习者记忆和个性化排序。"

  - path: "scripts/"
    purpose: "辅助脚本目录。"
    status: "active"
    read_when:
      - "做 Python 评测脚本、Prompt 实验或数据清理。"
    notes: "当前包含 resource 恢复脚本；Python 只用于辅助脚本、评测和数据处理。"
    risk: "Python 不应成为桌面 App 运行时依赖。"

  - path: "scripts/restore_competition_resources.py"
    purpose: "从大赛官网恢复 resource/ 下的官方页面、附件和文本抽取。"
    status: "active"
    read_when:
      - "resource/ 资料缺失。"
      - "需要重新核对或刷新比赛官方资料。"
    notes: "使用 requests 抓取官网页面和附件，使用 PyMuPDF/zip XML 抽取 PDF/DOCX 文本。"
    risk: "该脚本会覆盖同名 resource 文件；运行前应确认 Git 状态可回滚。"

  - path: "scripts/extract-asar.mjs"
    purpose: "一次性只读脚本：从 Codex app.asar 提取主题注册表与主题 chunk 文件。"
    status: "active"
    read_when:
      - "Codex 更新后需要重新核对或刷新内置主题来源。"
    notes: "使用 Node 原生 fs/buffer 解析 ASAR 格式（不新增依赖），只读取不修改；用 Get-AppxPackage OpenAI.Codex 动态定位安装目录后传入 app.asar 路径。"
    risk: "仅作为开发期一次性只读工具，不构成运行时依赖；Codex 更新后路径与哈希会变化，应重新动态定位。"

  - path: "scripts/parse-themes.mjs"
    purpose: "一次性只读脚本：从提取的主题 chunk 解析核心调色板（surface/ink/accent/sidebar/selection/diff/skill）。"
    status: "active"
    read_when:
      - "Codex 主题 chunk 格式变化或需要重新提取核心配色。"
    notes: "按 Codex 注册表 FSi 规则从 VS Code theme colors 推导核心调色板，输出 palette.json 供 derive-themes.mjs 使用。"
    risk: "只读开发脚本，不构成运行时依赖。"

  - path: "scripts/derive-themes.mjs"
    purpose: "一次性脚本：把核心调色板派生为 ReadRayThemeV1 完整 28-token 并做对比度预检。"
    status: "active"
    read_when:
      - "调整 Codex 主题派生规则或对比度修正覆盖。"
    notes: "把带 alpha 前景合成到不透明表面后再线性插值派生；输出 core-palette.json 作为 gen-themes.mjs 的权威输入，并报告对比度低于 4.5:1 的主题。"
    risk: "派生规则修改后必须重新生成两端数据并重跑验证；只读开发脚本。"

  - path: "scripts/gen-themes.mjs"
    purpose: "数据驱动内置主题生成器：从 core-palette.json 生成 Rust 与前端两份字节级一致的完整配色数据。"
    status: "active"
    read_when:
      - "调整 Codex 内置主题配色、来源或许可证归属。"
    notes: "输出 src-tauri/src/codex_themes_data.rs 与 src/codexThemeData.ts；生成后需运行 cargo fmt --check 与 pnpm test:settings 验证。"
    risk: "生成数据改动会影响全部内置主题校验；不要手工编辑生成文件，改 core-palette.json 后重跑。"

app_scaffold:
  - path: ".env.example"
    purpose: "本地开发环境变量占位示例。"
    status: "active"
    read_when:
      - "配置 DeepSeek API key。"
      - "排查开发期环境变量读取。"
    notes: "复制为 .env 后填写本机密钥；.env 不提交。Tauri 启动时由 Rust dotenvy 从项目根目录加载 .env。"
    risk: "不要把真实 DEEPSEEK_API_KEY 写入该文件或任何提交文件。"

  - path: "package.json"
    purpose: "前端依赖、Vite 构建命令和 Tauri CLI 命令。"
    status: "active"
    read_when:
      - "调整 npm/pnpm 脚本。"
      - "排查前端构建或 Tauri CLI 调用。"
    notes: "包管理器使用 pnpm；当前脚本包含 dev、build、preview、test:conversation、test:review、test:writing、test:settings 和 tauri。官方 @tauri-apps/plugin-dialog 同时提供 Markdown 保存路径与本地主题目录选择；test:settings 包含主题聚焦测试。"
    risk: "不要无依据新增运行时依赖。"

  - path: "pnpm-lock.yaml"
    purpose: "pnpm 依赖锁定文件。"
    status: "active"
    read_when:
      - "排查依赖版本。"
      - "复现前端或 Tauri CLI 安装问题。"
    notes: "由 pnpm install 生成。"
    risk: "不要手工编辑锁文件。"

  - path: "src-tauri/Cargo.lock"
    purpose: "Rust / Tauri 依赖锁定文件。"
    status: "active"
    read_when:
      - "排查 Rust 依赖版本。"
      - "复现 Tauri 编译问题。"
    notes: "由 cargo fetch / pnpm tauri dev 生成。"
    risk: "不要手工编辑锁文件。"

  - path: "src-tauri/Cargo.toml"
    purpose: "Rust/Tauri crate、插件和 Windows 功能依赖声明。"
    status: "active"
    read_when:
      - "调整 Tauri 插件或 Rust 依赖。"
      - "排查原生导出、SQLite 或 Windows 编译。"
    notes: "桌面生命周期开启 tauri 的 tray-icon feature，并新增仅 Rust 使用的官方 tauri-plugin-single-instance 与 tauri-plugin-autostart；single-instance 最先注册。未新增前端插件依赖或 capability，SQLite 仍由现有 rusqlite bundled 负责。"
    risk: "新增依赖前必须说明必要性、替代方案及打包影响；不得为会话管理引入第二套存储或模型客户端。"

  - path: "src-tauri/capabilities/default.json"
    purpose: "主窗口 Tauri capability 权限。"
    status: "active"
    read_when:
      - "调整主窗口插件权限。"
      - "排查原生保存对话框权限。"
    notes: "主窗口只开放主题目录选择所需的 dialog:allow-open、导出/备份所需的 dialog:allow-save 和既有 opener 权限；主题文件仍由受控 Rust command 读取，备份内容由受控 Rust command 写入用户选择的路径，数据目录由 Rust 自行解析后打开。透明窗口自绘边缘 resize 需要 core:window:allow-start-resize-dragging 权限（前端 getCurrentWindow().startResizeDragging 调用）。"
    risk: "只开放当前功能需要的权限，不使用 dialog:default 或无关文件系统权限扩大范围。"

external_refs:
  - name: "Tauri 官方文档"
    purpose: "Windows 前置条件、全局快捷键、SQL、打包。"
    read_when: "实现或排查 Tauri 相关能力时。"
    risk: "这些信息可能变化，需要查官方当前文档。"

  - name: "DeepSeek API 文档"
    purpose: "实现 LLM 调用。"
    read_when: "接入 DeepSeek OpenAI-compatible API 时。"
    risk: "API 参数和模型名可能变化，需要查官方当前文档。"

  - name: "SQLite / rusqlite 文档"
