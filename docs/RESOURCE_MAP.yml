project:
  name: "ReadRay"
  description: "Windows 优先的本地英语学习 Agent"
  repo_root: "."

meta:
  version: "0.8"
  last_updated: "2026-06-28"
  updated_by: "Codex"
  source_of_truth: "docs/RESOURCE_MAP.yml"
  language: "zh-CN"

reading_policy:
  default_sequence:
    - "AGENTS.md"
    - "docs/RESOURCE_MAP.yml"
    - "只读取当前任务需要的文件"
  avoid:
    - "除非正在准备比赛材料，否则不要一次性读取 resource/ 下所有文件。"
    - "没有明确原因时，不要扫描整个仓库。"
    - "当本地文档已经记录决策时，不要从聊天历史里重建项目决策。"

core_docs:
  - path: "AGENTS.md"
    purpose: "Codex 协作规则和启动流程。"
    status: "active"
    read_when:
      - "开始新的 Codex 会话。"
      - "不确定项目约定。"
      - "需要判断是否添加流程、依赖或架构。"
    notes: "只记录会改变 Codex 行为的规则；背景信息、阶段计划和技术细节放到 docs/。"
    risk: "不要把临时想法、宽泛口号或不会改变行为的规则塞进本文件。"

  - path: "docs/DEVELOPMENT_PLAN.md"
    purpose: "项目定位、技术栈、核心原则、阶段计划和风险说明。"
    status: "active"
    read_when:
      - "讨论路线、技术栈、产品范围、MVP 或比赛策略。"
      - "决策桌面能力接入、Agent 层、SQLite、LLM 供应商。"
      - "规划新的实现阶段。"
    notes: "项目方向、技术栈和阶段计划以本文件为准。"
    risk: "不要从聊天历史恢复已被本文件覆盖的旧决策。"

  - path: "docs/HANDOFF.md"
    purpose: "当前状态快照、已确认决策、下一步、待解决问题。"
    status: "active"
    read_when:
      - "继续上一次开发。"
      - "需要了解当前状态、下一步或待解决问题。"
      - "任务产生交接价值，需要更新当前状态快照。"
    notes: "只记录会影响下一次恢复上下文的信息；开头 TL;DR 用于新会话快速恢复。"
    risk: "不要把小型措辞、格式调整或已经能从文件本身看出的变化写成流水账。"

  - path: "docs/WINDOWS_ENVIRONMENT.md"
    purpose: "Windows 开发环境、VS Build Tools 修复经验、验证命令和磁盘占用策略。"
    status: "active"
    read_when:
      - "排查 Tauri Windows 开发环境。"
      - "处理 MSVC、Windows SDK、Rust、Cargo 或 VS Build Tools 问题。"
      - "评估 C 盘空间压力、缓存迁移或 VS Build Tools 重装到 D 盘。"
      - "在 Codex 中运行 pnpm 构建、启动 Tauri dev 或发布到 GitHub。"
    notes: "记录可复用环境经验和本机命令/发布基线，不写成每次操作流水账；已有基线应优先复用，不要先走通用工具探测。"
    risk: "不要手动移动 VS 或 SDK 目录；迁移前先确认安装器、缓存和 Junction 策略。"

competition_resources:
  directory: "resource/"
  status: "active"
  read_when:
    - "准备比赛文档。"
    - "检查提交要求。"
    - "写作品简介、项目文档或演示脚本。"
    - "比较 ReadRay 与官方赛题要求。"
  notes: "2026-06-22 已从大赛官网重新恢复页面、附件和文本抽取；如涉及官方日期和规则，仍以官网当前页面为准。"
  files:
    - path: "resource/official_2026_topics_and_submission.md"
      purpose: "官方赛题页抽取文本，包含开放赛题、地方赛题、华为赛题和附件链接。"
      status: "active"
      notes: "用于赛题方向判断。"
      risk: "若涉及官方日期和规则，必要时重新核对官网。"

    - path: "resource/official_2026_invitation_and_rules.md"
      purpose: "官方邀请函/规则页抽取文本，包含参赛方式、赛程和奖项设置。"
      status: "active"
      notes: "用于规则、赛程和参赛对象确认。"
      risk: "若比赛官网更新，以官网当前页面为准。"

    - path: "resource/official_2026_homepage.md"
      purpose: "赛事主页抽取文本。"
      status: "active"
      notes: "用于补充主页入口、赛程和通知列表信息。"
      risk: "不要用它替代附件中的提交规范。"

    - path: "resource/attachment1_initial_submission_spec.txt"
      purpose: "初赛作品提交规范文本。"
      status: "active"
      notes: "查询作品简介、项目文档、视频、ZIP、截止时间等提交格式时优先读取。"
      risk: "PDF 原件同目录保留；如文本有抽取疑问，回看 PDF。"

    - path: "resource/attachment2_project_document_template.txt"
      purpose: "项目文档模板文本。"
      status: "active"
      notes: "写项目文档结构时优先读取。"
      risk: "模板字段应服务于 ReadRay 叙事，不要机械填充。"

    - path: "resource/attachment3_huawei_topics.txt"
      purpose: "华为赛题细则文本。"
      status: "active"
      notes: "用于判断是否需要兼报或对照华为赛题。"
      risk: "当前 ReadRay 主线不按华为专项推进。"

    - path: "resource/invitation_attachment1_participant_guide.txt"
      purpose: "参赛指南文本。"
      status: "active"
      notes: "用于资格、流程、奖项和组织要求确认。"
      risk: "与官网页面冲突时重新核对官方来源。"

    - path: "resource/invitation_attachment2_invitation_letter.txt"
      purpose: "邀请函盖章版抽取文本。"
      status: "active"
      notes: "用于补充官方通知口径。"
      risk: "该 PDF 抽取曾有字体警告；需要精确引用时回看 PDF。"

    - path: "resource/readray_competition_analysis.md"
      purpose: "前期比赛分析和 ReadRay 定位建议。"
      status: "active"
      notes: "用于快速回顾比赛建议、MVP、风险和路线。"
      risk: "这是综合分析，不替代官方附件。"

source_areas:
  - path: "src/"
    purpose: "React 前端源码。"
    status: "active"
    read_when:
      - "开发解释卡、历史页、复盘页、设置页。"
    notes: "Tauri + Vite + React + TypeScript 脚手架入口；当前主要入口是 src/main.tsx 和 src/App.tsx，App.tsx 默认进入无选区 overlay 输入体验；无选区输入默认为空，已通过 create_explanation_card 调用真实 DeepSeek 查询并映射到 CenteredResultPanel；mock 划词浮层和阶段验证控件保留为开发辅助，默认隐藏，可用 Ctrl+Shift+D 临时显示。"
    risk: "不要在前端入口塞入原生系统逻辑。"

  - path: "src/components/AnchoredResultPopover.tsx"
    purpose: "MVP compact UI 的锚定划词结果浮层组件骨架。"
    status: "active"
    read_when:
      - "开发或调整 compact 查词结果浮层。"
      - "接入 selectedText/contextText mock 或真实解释卡数据。"
    notes: "当前由 App 传入静态 mock 数据、anchorRect、open 和 onOpenChange；组件内部负责 fixed 定位、下方优先、空间不足向上翻转、Esc 隐藏和 highlightText 例句高亮。不接真实 UI Automation 或 DeepSeek 解释卡。"
    risk: "不要提前扩展成通用组件库；只服务当前锚定结果浮层。"

  - path: "src/components/CenteredCommandInput.tsx"
    purpose: "MVP compact UI 的无选区居中输入组件骨架。"
    status: "active"
    read_when:
      - "开发无选区快捷键呼出的主动查询输入框。"
      - "调整 typing、loading 或 error-lite 状态。"
    notes: "当前由 App 传入 value、open、loading、error 和提交回调；组件内部负责打开自动聚焦、Esc 关闭、Enter 非空提交、loading 轻量呼吸点、error-lite 轻提示和输入态拖拽区域。无选区提交已由 App 接入真实 create_explanation_card；本组件不接 UI Automation。"
    risk: "不要扩展成命令面板、历史入口或正式结果页；它只负责无选区输入。"

  - path: "src/components/CenteredResultPanel.tsx"
    purpose: "MVP compact UI 的无选区输入后居中结果面板骨架。"
    status: "active"
    read_when:
      - "开发无选区主动查询提交后的结果展示。"
      - "调整居中结果面板的信息结构、滚动内容或 mock 数据映射。"
    notes: "当前由 App 传入 query 和 ExplanationCard 映射后的 result；顶部保留可编辑用户输入，内容区展示语块、近义理解和例句，内部可滚动，面板顶部提供拖拽区域。结果头部不展示低信息标签；只有 reviewHint 有内容时才显示右侧提示。不做聊天流、底部操作按钮、历史、收藏、复盘或设置入口。"
    risk: "不要把它扩展成完整结果页或 AI 对话界面；它只服务 MVP compact 主动查询结果态。"

  - path: "src/styles/tokens.css"
    purpose: "ReadRay 前端轻量样式 token。"
    status: "active"
    read_when:
      - "调整 Graphite + Amber 视觉风格。"
      - "修改 compact UI 基础色彩、边框、圆角、阴影、间距或字体。"
    notes: "只放当前前端需要的轻量设计 token，不引入完整设计系统。"
    risk: "不要把它扩成大型 UI 组件库或引入外部 UI 框架。"

  - path: "src-tauri/"
    purpose: "Tauri / Rust 原生层源码。"
    status: "active"
    read_when:
      - "开发全局快捷键、剪贴板、窗口行为、SQLite 命令、原生配置。"
    notes: "当前包含 Tauri v2 配置、Rust 入口、capabilities 和官方插件 opener/global-shortcut/clipboard-manager/sql；关键文件是 src-tauri/tauri.conf.json、src-tauri/Cargo.toml、src-tauri/src/main.rs、src-tauri/src/lib.rs、src-tauri/capabilities/default.json、src-tauri/capabilities/desktop.json。tauri.conf.json 已把主窗口改为无边框、透明、置顶、跳过任务栏的 overlay 壳，初始输入态尺寸为 720x104；无已保存位置时按屏幕偏上区域定位，拖动命令会在当前进程内显式记住新位置，失焦时自动隐藏。"
    risk: "不要把 UI 状态和业务展示逻辑塞进 Rust 层。"

  - path: "src-tauri/src/windows_uia.rs"
    purpose: "Windows UI Automation 上下文捕获 spike。"
    status: "experimental"
    read_when:
      - "验证或扩展 Windows 跨应用选区捕获。"
      - "排查 selectedText、contextText、anchorRect 或前台应用诊断。"
      - "调整开发期 Ctrl+Alt+U 捕获快捷键。"
    notes: "仅 Windows 编译；按焦点元素、窗口根、ElementFromPoint、Raw View 祖先和必要时子树的顺序寻找 TextPattern2/TextPattern。Obsidian 1.12.7 编辑/阅读模式均已验证单词、短语、无选区和滚动后选区；阅读模式选区命中祖先 Document 的 TextPattern2。捕获发生在 ReadRay show/focus 前，Ctrl+Alt+U 只输出 READRAY_UIA_CAPTURE JSON 和诊断，不显示居中输入框。"
    risk: "这是开发期技术 spike，不要直接接 DeepSeek、SQLite、OCR 或正式 UI；本轮未实现 MSAA/IAccessible2 和剪贴板辅助，因为 Obsidian 阅读模式已由 UIA 取得三项数据。不同应用仍需分别验证。"

  - path: "src-tauri/src/explanation.rs"
    purpose: "阶段二 ExplanationCard 中间协议、CaptureInput 类型和 Rust validator。"
    status: "active"
    read_when:
      - "接入 DeepSeek 结构化输出。"
      - "调整解释卡 schema、字段限长或校验规则。"
      - "把解释卡映射到 compact UI 或后续 SQLite 本地记忆。"
    notes: "schema 是 ReadRay 中间协议，不是前端组件 props；当前支持 word/phrase/sentence 类型，测试重点覆盖 word；无 contextText 时不允许 contextMeaning。"
    risk: "不要在这里接真实 DeepSeek 查询链路、SQLite schema 或 UI 交互逻辑。"

  - path: "src-tauri/src/deepseek_explanation.rs"
    purpose: "DeepSeek 结构化 ExplanationCard 查询 command、prompt、响应解析和 validator 装配。"
    status: "active"
    read_when:
      - "调整 create_explanation_card command。"
      - "排查 DeepSeek 结构化 JSON 输出、serde 解析或 validator 失败。"
      - "将 ExplanationCard 接入 compact UI 前的 Rust 层查询链路。"
    notes: "command 输入为 CaptureInput，成功返回 ExplanationCard；请求使用 response_format=json_object，并在解析后调用 validate_explanation_card。当前不接前端 UI，不做 SQLite。"
    risk: "不要在日志、文档或提交文件中写入真实 DEEPSEEK_API_KEY；不要把 UI 映射和真实查询链路混成一次大改。"

  - path: "scripts/"
    purpose: "辅助脚本目录。"
    status: "active"
    read_when:
      - "做 Python 评测脚本、Prompt 实验或数据清理。"
    notes: "当前包含 resource 恢复脚本；Python 只用于辅助脚本、评测和数据处理。"
    risk: "Python 不应成为桌面 App 运行时依赖。"

  - path: "scripts/restore_competition_resources.py"
    purpose: "从大赛官网恢复 resource/ 下的官方页面、附件和文本抽取。"
    status: "active"
    read_when:
      - "resource/ 资料缺失。"
      - "需要重新核对或刷新比赛官方资料。"
    notes: "使用 requests 抓取官网页面和附件，使用 PyMuPDF/zip XML 抽取 PDF/DOCX 文本。"
    risk: "该脚本会覆盖同名 resource 文件；运行前应确认 Git 状态可回滚。"

app_scaffold:
  - path: ".env.example"
    purpose: "本地开发环境变量占位示例。"
    status: "active"
    read_when:
      - "配置 DeepSeek API key。"
      - "排查开发期环境变量读取。"
    notes: "复制为 .env 后填写本机密钥；.env 不提交。Tauri 启动时由 Rust dotenvy 从项目根目录加载 .env。"
    risk: "不要把真实 DEEPSEEK_API_KEY 写入该文件或任何提交文件。"

  - path: "package.json"
    purpose: "前端依赖、Vite 构建命令和 Tauri CLI 命令。"
    status: "active"
    read_when:
      - "调整 npm/pnpm 脚本。"
      - "排查前端构建或 Tauri CLI 调用。"
    notes: "包管理器使用 pnpm；当前脚本包含 dev、build、preview、tauri。"
    risk: "不要无依据新增运行时依赖。"

  - path: "pnpm-lock.yaml"
    purpose: "pnpm 依赖锁定文件。"
    status: "active"
    read_when:
      - "排查依赖版本。"
      - "复现前端或 Tauri CLI 安装问题。"
    notes: "由 pnpm install 生成。"
    risk: "不要手工编辑锁文件。"

  - path: "src-tauri/Cargo.lock"
    purpose: "Rust / Tauri 依赖锁定文件。"
    status: "active"
    read_when:
      - "排查 Rust 依赖版本。"
      - "复现 Tauri 编译问题。"
    notes: "由 cargo fetch / pnpm tauri dev 生成。"
    risk: "不要手工编辑锁文件。"

external_refs:
  - name: "Tauri 官方文档"
    purpose: "Windows 前置条件、全局快捷键、SQL、打包。"
    read_when: "实现或排查 Tauri 相关能力时。"
    risk: "这些信息可能变化，需要查官方当前文档。"

  - name: "DeepSeek API 文档"
    purpose: "实现 LLM 调用。"
    read_when: "接入 DeepSeek OpenAI-compatible API 时。"
    risk: "API 参数和模型名可能变化，需要查官方当前文档。"

  - name: "SQLite / Tauri SQL 文档"
    purpose: "实现本地持久化。"
    read_when: "设计或排查 SQLite 读写时。"
    risk: "插件版本和权限配置需要按当前 Tauri 版本确认。"
