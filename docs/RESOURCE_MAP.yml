    status: "active"
    read_when:
      - "接入 DeepSeek 结构化输出。"
      - "调整解释卡 schema、字段限长或校验规则。"
      - "把解释卡映射到 compact UI 或后续 SQLite 本地记忆。"
    notes: "schema 是 ReadRay 中间协议，不是前端组件 props；当前使用 serde tagged enum 明确区分 word/phrase/sentence/paragraph。输入 queryText/contextText 上限为 4096 字符；CaptureInput 可选携带 sourceApp；无 contextText 时不允许 contextMeaning；句子和段落以完整 translation 为核心，不继承单词卡必填项。"
    risk: "不要在这里接真实 DeepSeek 查询链路、SQLite schema 或 UI 交互逻辑。"

  - path: "src-tauri/src/deepseek_explanation.rs"
    purpose: "DeepSeek 结构化 ExplanationCard 查询 command、prompt、响应解析和 validator 装配。"
    status: "active"
    read_when:
      - "调整 create_explanation_card command。"
      - "排查 DeepSeek 结构化 JSON 输出、serde 解析或 validator 失败。"
      - "将 ExplanationCard 接入 compact UI 前的 Rust 层查询链路。"
    notes: "command 输入为 CaptureInput，先在本地判断 word/phrase/sentence/paragraph，再使用对应 JSON schema prompt；请求使用 response_format=json_object，解析前以捕获输入覆盖 sourceText，随后 serde 解析并调用 validate_explanation_card。校验成功后统一调用 learning_records 自动保存；manual 无选区输入和 windows_uia 划词解释卡共用该链路。"
    risk: "不要在日志、文档或提交文件中写入真实 DEEPSEEK_API_KEY；保存失败必须返回清晰错误，不能伪装为查询成功。"

  - path: "src-tauri/src/deepseek_client.rs"
    purpose: "DeepSeek API key、模型选择和 chat/completions HTTP 错误边界。"
    status: "active"
    read_when:
      - "新增或排查 DeepSeek 请求链路。"
      - "调整共享请求、HTTP 状态或响应结构错误分类。"
    notes: "ExplanationCard、Quick AI 与写作分析/问答共用该传输边界；默认模型仍为 deepseek-v4-flash，不记录或返回 API key。"
    risk: "这里只负责 HTTP 传输，不放 ExplanationCard、Quick AI 或写作业务 prompt 和存储。"

  - path: "src-tauri/src/conversations.rs"
    purpose: "Quick AI conversation/message SQLite 仓库和序列化协议。"
    status: "active"
    read_when:
      - "调整 Quick AI 对话持久化或继续历史对话。"
      - "实现未来主应用对话历史读取。"
    notes: "复用 v2 表、消息自增 ID 与 UNIQUE(conversation_id, sequence)，未新增迁移。prepare_turn 先独立提交 pending user；complete_turn 只在匹配的 user ID/expected sequence 后补 assistant，完成轮次重试直接返回权威快照，旧版本或并发冲突拒绝写入。"
    risk: "不要把 Quick AI 消息写入 learning_records；当前不实现完整历史页、删除、重命名、长期记忆或检索增强。"

  - path: "src-tauri/src/quick_ai.rs"
    purpose: "Quick AI 多轮 DeepSeek 请求、上下文装配和 Tauri commands。"
    status: "active"
    read_when:
      - "调整 Quick AI system prompt、上下文窗口或发送流程。"
      - "排查 create/get/send/list_recent Quick AI commands。"
    notes: "独立于 ExplanationCard JSON 协议；send command 要求已创建的 conversationId 和 expectedUserSequence，先 prepare pending user，再从该 SQLite 快照装配多轮上下文并调用模型，成功后 complete assistant；已完成轮次不会再次请求模型。"
    risk: "不接学习记录检索、工具调用、联网搜索、长期记忆或通用 Agent 框架。"

  - path: "src-tauri/src/writing.rs"
    purpose: "阶段五写作 SQLite repository、结构化 DeepSeek 分析/问答和 Tauri commands。"
    status: "active"
    read_when:
      - "调整写作文章 CRUD、搜索、revision、版本、分析或问答。"
      - "排查写作保存/模型失败、过期结果拒绝或 schema validator。"
    notes: "复用 readray.sqlite3 与 deepseek_client；文章、草稿、完成稿、不可变版本、对比基线、分析和问答均由数据库生成 ID/时间。分析保存会原子推进 revision；activeAnalysis 只读取当前 revision，baselineAnalysis 按 comparison_baseline_revision 独立恢复。完成与分析使用写事务串行化，同一 expectedRevision 只能有一方提交；完成版本在同一事务中固化 source revision，以及同一检查基线绑定的 analysis/baseline revision、问题和模式，检查后编辑时 source 可晚于二者。legacy comparison_baseline_revision 为 null 时，只读取与 expectedRevision 精确匹配的分析并保存其 analysisRevision，未知基线仍保持 null。当前草稿追问允许引用最近完成版本之后同一草稿会话的旧 revision 回答，并沿 parentAnswerId 向模型提供同一可见身份内最近 8 条有序问答；历史问答仍按 versionId 使用屏幕所见不可变正文，跨边界链路拒绝调用模型。分析提示词只允许从本文真实问题提炼最多 4 个高价值可迁移写作要点，不枚举好词好句；validator 只接受正文中可定位、source 与 targetText 可验证的原文。"
    risk: "不得写入 learning_records/quick_ai 表、跨 await 持有 SQLite 事务、建立第二套模型客户端或让未校验 JSON 进入前端。"

  - path: "src-tauri/src/learning_records.rs"
    purpose: "阶段三 SQLite 学习事件迁移、Rust 存储边界和 Tauri 数据 commands。"
    status: "active"
    read_when:
      - "调整学习记录 schema、迁移或存储字段。"
      - "实现学习记录窗口、搜索、筛选、单条读取或删除。"
      - "排查自动保存或应用数据目录中的 SQLite 问题。"
    notes: "使用 rusqlite bundled，在 Tauri 应用数据目录创建 readray.sqlite3；v1 为学习记录、v2 为 Quick AI、v3 追加写作文章/分析/版本/回答表，v4 追加对比基线/分析 revision 元数据和回答 versionId。v3 升级时无法从既有数据可靠证明的基线 revision 与版本 analysis revision 均保持 null，不从 source_revision 伪造来源。除学习记录分页/search/get/delete 外，提供按前端本机日期范围统计数量与最新记录的只读今日摘要 command。"
    risk: "学习记录仍只做事件存储，不做去重、聚合、remembered/forgotten、趋势或历史 UI；新增 schema 必须继续追加 migration，不能改写已发布迁移。"

  - path: "scripts/"
    purpose: "辅助脚本目录。"
    status: "active"
    read_when:
      - "做 Python 评测脚本、Prompt 实验或数据清理。"
    notes: "当前包含 resource 恢复脚本；Python 只用于辅助脚本、评测和数据处理。"
    risk: "Python 不应成为桌面 App 运行时依赖。"

  - path: "scripts/restore_competition_resources.py"
    purpose: "从大赛官网恢复 resource/ 下的官方页面、附件和文本抽取。"
    status: "active"
    read_when:
      - "resource/ 资料缺失。"
      - "需要重新核对或刷新比赛官方资料。"
    notes: "使用 requests 抓取官网页面和附件，使用 PyMuPDF/zip XML 抽取 PDF/DOCX 文本。"
    risk: "该脚本会覆盖同名 resource 文件；运行前应确认 Git 状态可回滚。"

app_scaffold:
