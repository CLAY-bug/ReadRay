project:
  name: "ReadRay"
  description: "Windows 优先的本地英语学习 Agent"
  repo_root: "."

meta:
  version: "1.5"
  last_updated: "2026-07-29"
  updated_by: "Codex"
  source_of_truth: "docs/RESOURCE_MAP.yml"
  language: "zh-CN"

reading_policy:
  default_sequence:
    - "AGENTS.md"
    - "docs/RESOURCE_MAP.yml"
    - "只读取当前任务需要的文件"
  avoid:
    - "除非正在准备比赛材料，否则不要一次性读取 resource/ 下所有文件。"
    - "没有明确原因时，不要扫描整个仓库。"
    - "当本地文档已经记录决策时，不要从聊天历史里重建项目决策。"

core_docs:
  - path: "AGENTS.md"
    purpose: "Codex 协作规则和启动流程。"
    status: "active"
    read_when:
      - "开始新的 Codex 会话。"
      - "不确定项目约定。"
      - "需要判断是否添加流程、依赖或架构。"
    notes: "只记录会改变 Codex 行为的规则；背景信息、阶段计划和技术细节放到 docs/。"
    risk: "不要把临时想法、宽泛口号或不会改变行为的规则塞进本文件。"

  - path: "docs/DEVELOPMENT_PLAN.md"
    purpose: "项目定位、技术栈、核心原则、阶段计划和风险说明。"
    status: "active"
    read_when:
      - "讨论路线、技术栈、产品范围、MVP 或比赛策略。"
      - "决策桌面能力接入、Agent 层、SQLite、LLM 供应商。"
      - "规划新的实现阶段。"
    notes: "项目方向、技术栈和阶段计划以本文件为准。"
    risk: "不要从聊天历史恢复已被本文件覆盖的旧决策。"

  - path: "docs/HANDOFF.md"
    purpose: "当前状态快照、已确认决策、下一步、待解决问题。"
    status: "active"
    read_when:
      - "继续上一次开发。"
      - "需要了解当前状态、下一步或待解决问题。"
      - "任务产生交接价值，需要更新当前状态快照。"
    notes: "只记录会影响下一次恢复上下文的信息；开头 TL;DR 用于新会话快速恢复。"
    risk: "不要把小型措辞、格式调整或已经能从文件本身看出的变化写成流水账。"

  - path: "docs/WINDOWS_ENVIRONMENT.md"
    purpose: "Windows 开发环境、VS Build Tools 修复经验、验证命令和磁盘占用策略。"
    status: "active"
    read_when:
      - "排查 Tauri Windows 开发环境。"
      - "处理 MSVC、Windows SDK、Rust、Cargo 或 VS Build Tools 问题。"
      - "评估 C 盘空间压力、缓存迁移或 VS Build Tools 重装到 D 盘。"
      - "在 Codex 中运行 pnpm 构建、启动 Tauri dev 或发布到 GitHub。"
    notes: "记录可复用环境经验和本机命令/发布基线，不写成每次操作流水账；已有基线应优先复用，不要先走通用工具探测。"
    risk: "不要手动移动 VS 或 SDK 目录；迁移前先确认安装器、缓存和 Junction 策略。"

competition_resources:
  directory: "resource/"
  status: "active"
  read_when:
    - "准备比赛文档。"
    - "检查提交要求。"
    - "写作品简介、项目文档或演示脚本。"
    - "比较 ReadRay 与官方赛题要求。"
  notes: "2026-06-22 已从大赛官网重新恢复页面、附件和文本抽取；如涉及官方日期和规则，仍以官网当前页面为准。"
  files:
    - path: "resource/official_2026_topics_and_submission.md"
      purpose: "官方赛题页抽取文本，包含开放赛题、地方赛题、华为赛题和附件链接。"
      status: "active"
      notes: "用于赛题方向判断。"
      risk: "若涉及官方日期和规则，必要时重新核对官网。"

    - path: "resource/official_2026_invitation_and_rules.md"
      purpose: "官方邀请函/规则页抽取文本，包含参赛方式、赛程和奖项设置。"
      status: "active"
      notes: "用于规则、赛程和参赛对象确认。"
      risk: "若比赛官网更新，以官网当前页面为准。"

    - path: "resource/official_2026_homepage.md"
      purpose: "赛事主页抽取文本。"
      status: "active"
      notes: "用于补充主页入口、赛程和通知列表信息。"
      risk: "不要用它替代附件中的提交规范。"

    - path: "resource/attachment1_initial_submission_spec.txt"
      purpose: "初赛作品提交规范文本。"
      status: "active"
      notes: "查询作品简介、项目文档、视频、ZIP、截止时间等提交格式时优先读取。"
      risk: "PDF 原件同目录保留；如文本有抽取疑问，回看 PDF。"

    - path: "resource/attachment2_project_document_template.txt"
      purpose: "项目文档模板文本。"
      status: "active"
      notes: "写项目文档结构时优先读取。"
      risk: "模板字段应服务于 ReadRay 叙事，不要机械填充。"

    - path: "resource/attachment3_huawei_topics.txt"
      purpose: "华为赛题细则文本。"
      status: "active"
      notes: "用于判断是否需要兼报或对照华为赛题。"
      risk: "当前 ReadRay 主线不按华为专项推进。"

    - path: "resource/invitation_attachment1_participant_guide.txt"
      purpose: "参赛指南文本。"
      status: "active"
      notes: "用于资格、流程、奖项和组织要求确认。"
      risk: "与官网页面冲突时重新核对官方来源。"

    - path: "resource/invitation_attachment2_invitation_letter.txt"
      purpose: "邀请函盖章版抽取文本。"
      status: "active"
      notes: "用于补充官方通知口径。"
      risk: "该 PDF 抽取曾有字体警告；需要精确引用时回看 PDF。"

    - path: "resource/readray_competition_analysis.md"
      purpose: "前期比赛分析和 ReadRay 定位建议。"
      status: "active"
      notes: "用于快速回顾比赛建议、MVP、风险和路线。"
      risk: "这是综合分析，不替代官方附件。"

source_areas:
  - path: "src/"
    purpose: "React 前端源码。"
    status: "active"
    read_when:
      - "开发解释卡、历史页、写作页、复盘页、设置页。"
    notes: "Tauri + Vite + React + TypeScript 脚手架入口；App.tsx 按 URL 区分 main 与 overlay：main 只装配主应用窗口控制，默认入口继续承载 Ctrl+Alt+R 无选区解释、Quick AI 和 UIA 锚定卡链路。"
    risk: "不要在前端入口塞入原生系统逻辑。"

  - path: "src/components/MainAppShell.tsx"
    purpose: "ReadRay 正常主应用的无边框外壳、标题栏和内容页装配边界。"
    status: "active"
    read_when:
      - "调整正常主应用壳、标题栏、侧栏折叠或首页装配。"
      - "将主应用接入独立 Tauri 窗口。"
    notes: "当前通过 ?view=main 进入主应用，并在同一外壳内切换“今天”“写作”“记忆”和“对话”；由装配层加载 TodayService、MemoryService、ConversationService 与最近 Quick AI 对话，页面组件不直接读取数据库。"
    risk: "不要把快捷 overlay 状态机或 invoke 迁入页面组件；对话页当前只接前端 fixture service，不能误当作真实 Quick AI 历史或发送链路。"

  - path: "src/components/MainSidebar.tsx"
    purpose: "主应用全局左侧栏，包含新对话、学习导航、最近对话、查看全部和设置入口。"
    status: "active"
    read_when:
      - "调整主应用导航结构、最近对话展示或手动折叠态。"
    notes: "默认宽 252px，用户手动折叠为 72px 纯图标栏；展开态最近对话来自真实 Quick AI 标题，并支持 loading/empty/error/retry。"
    risk: "组件只消费装配层数据；最近对话点击已进入前端对话页，但完整历史读取、查看全部、删除和重命名仍没有真实 service。"

  - path: "src/components/TodayPage.tsx"
    purpose: "主应用首页“今天”的摘要、学习入口和底部输入框。"
    status: "active"
    read_when:
      - "调整今天页内容层级、学习入口或首页输入交互。"
    notes: "消费 TodayService 映射后的本机日期、今日学习记录事实与状态；最近记录可进入记忆详情，写作入口继续进入文章库，输入框通过 callback 进入完整对话页。"
    risk: "不要在本组件调用 invoke/SQLite，不得显示待复习、高频词或趋势推断；输入只负责把 prompt 交给对话页，真实发送链路仍应在 ConversationService 装配层替换。"

  - path: "src/components/ConversationPage.tsx"
    purpose: "主应用完整对话页的消息流、输入、长提示折叠、生成状态、操作菜单和记忆引用抽屉。"
    status: "demo"
    read_when:
      - "调整完整对话页布局、消息展示或设计稿交互。"
      - "接入真实 Quick AI 历史、发送、导出或记忆引用。"
    notes: "复用 MainAppShell、MainSidebar 和全局标题栏；严格按 readray-conversation-2.html 的 736px 消息列和完整状态实现。续问先追加当前 thread，完成回答再写入 assistant；生成未结束时保留草稿并阻止再次发送和导出；停止/继续保留分片位置，重生成只替换当前最后一轮回答。"
    risk: "不得在页面组件直接调用 Tauri、SQLite 或 DeepSeek；不要重新加入设计稿之外的“带我学”“测试”等功能。"

  - path: "src/conversationViewModel.ts"
    purpose: "完整对话页的有类型消息、富文本块、记忆引用、入口请求和可替换 service 协议。"
    status: "active"
    read_when:
      - "调整对话页展示协议或替换真实对话 service。"
    notes: "页面只消费 ConversationThread 与 ConversationService，不复制 Rust Quick AI 数据库 schema；生成协议显式携带 conversationId、完整消息上下文、prompt 和 append/regenerate 模式，导出必须返回实际结果。"
    risk: "接真实 commands 时应在 service/repository 层映射，不能让 Rust 原始响应直接耦合组件。"

  - path: "src/conversationFixtureService.ts"
    purpose: "对话页浏览器预览与本轮桌面视觉骨架使用的有类型 fixture service。"
    status: "demo"
    read_when:
      - "维护设计稿示例对话、生成/失败/重试状态或前端预览。"
    notes: "支持新对话、六类设计示例、未知最近标题降级、前端流式回答和包含完整 thread 的 Markdown 导出文件；conversationFailure=create|load|generate|export 提供一次性显式故障注入，[fixture:slow] 只用于停止/继续验证。"
    risk: "该 service 不持久化 thread、不读取真实历史，也不请求 DeepSeek；接线后应在装配层替换而不是扩展成第二套业务层。"

  - path: "src/components/MemoryPage.tsx"
    purpose: "主应用“记忆”页的搜索、类型筛选、记录列表、详情和过去出现交互骨架。"
    status: "active"
    read_when:
      - "调整记忆页内容布局、筛选、选择或历史展开交互。"
      - "将记忆页 fixture 接入现有 learning_records Rust commands。"
    notes: "复用 MainAppShell、MainSidebar 和标题栏；通过装配层注入的 MemoryService 读取真实分页列表与单条详情，搜索和四类筛选均下推 Rust commands；保留键盘导航和 980px 以下列表/详情切换。"
    risk: "不要复制第二套 App Shell，不要在页面组件直接调用 Tauri、读取 SQLite 或退回全量前端过滤。"

  - path: "src/components/WritingPage.tsx"
    purpose: "主应用“写作”页的文档工作流与状态装配边界。"
    status: "active"
    read_when:
      - "调整写作草稿、检查、对比、完成稿或文章库状态流。"
      - "将写作前端演示 repository 替换为 Tauri/SQLite commands。"
    notes: "复用 MainAppShell、MainSidebar 和标题栏；WritingEditor、WritingCoach、WritingCompareView、WritingLibrary 分别负责正文编辑、写作辅助/问题教练、双栏差异和文章目录，支持空稿、自动保存演示、选区菜单、多轮检查、完成版本与继续修改。"
    risk: "不要复制第二套 App Shell，不要在页面组件直接读取 localStorage/SQLite，也不要把当前前端分析 fixture 误当作真实模型结果。"

  - path: "src/writingViewModel.ts"
    purpose: "写作模块的类型、文档/问题 fixture、写作模式总结和前端问答演示映射。"
    status: "active"
    read_when:
      - "调整写作页面协议、教练问题、示例文档或写作辅助演示回答。"
    notes: "包含 WritingSnapshot、WritingDocumentRecord、WritingIssue 等类型及设计稿确认的演示数据；不调用 Rust、SQLite、DeepSeek 或 Quick AI。"
    risk: "接入真实分析接口时保留页面模型边界，不把 LLM 原始响应直接耦合到组件。"

  - path: "src/writingRepository.ts"
    purpose: "可替换的写作文章前端 repository 边界。"
    status: "demo"
    read_when:
      - "调整写作刷新恢复演示或接入正式本地存储。"
    notes: "当前 BrowserWritingDemoRepository 仅为前端演示刷新恢复而封装 localStorage；页面组件只依赖 WritingRepository。"
    risk: "这不是正式 SQLite 方案；接入 Tauri commands 后应在装配层替换，不让页面组件直接访问数据库或 localStorage。"

  - path: "src/mainAppViewModel.ts"
    purpose: "主应用导航、Today 页面和最近对话的前端展示类型。"
    status: "active"
    read_when:
      - "替换今天页 mock 数据或接入真实主应用数据查询。"
    notes: "正式导出只保留静态导航与展示类型；Today 和最近对话数据由 service 提供。"
    risk: "不要把正式学习统计或 Quick AI 标题重新写成静态 fixture。"

  - path: "src/todayRepository.ts"
    purpose: "今天页与侧栏最近对话的 Tauri command repository。"
    status: "active"
    read_when:
      - "调整今日学习记录摘要、最近记录入口或 Quick AI 最近标题。"
    notes: "只调用 get_today_learning_summary 与 list_recent_quick_ai_conversations，不包含页面展示逻辑。"
    risk: "不得在 repository 前端读取 SQLite 或回退到 fixture。"

  - path: "src/todayService.ts"
    purpose: "今天页事实映射、本机日期边界和最近对话展示服务。"
    status: "active"
    read_when:
      - "排查今日自动刷新、日期范围或 Today 状态。"
      - "调整首页真实摘要和三个学习入口。"
    notes: "用本机当天起止时间生成仅由真实数据支持的文案和入口，并复用 LearningRecord 展示映射。"
    risk: "不得读取写作 fixture/localStorage 作为正式统计，也不得生成复习数量、高频或趋势推断。"

  - path: "src/mainAppFixture.ts"
    purpose: "今天页与侧栏的浏览器预览/测试专用 fixture。"
    status: "preview-only"
    read_when:
      - "维护非 Tauri 浏览器预览。"
    notes: "只保存预览样本，不由正式 Tauri 装配。"
    risk: "不得将预览摘要或对话标题装配到正式桌面路径。"

  - path: "src/todayPreviewService.ts"
    purpose: "今天页与侧栏的浏览器预览/测试专用 service。"
    status: "preview-only"
    read_when:
      - "维护非 Tauri 浏览器预览的数据装配。"
    notes: "由 App 仅在非 Tauri 运行时动态加载；正式 Tauri 路径不依赖本文件。"
    risk: "不得把前端预览数据误当成本机 SQLite 事实。"

  - path: "src/memoryViewModel.ts"
    purpose: "记忆页展示模型、静态文案和筛选定义。"
    status: "active"
    read_when:
      - "替换记忆页 mock 数据或建立 Rust 学习记录到页面模型的映射。"
    notes: "保留 MemoryRecordItem 展示模型，以及标题、今天/昨天/更早分组和四类筛选定义；不复制 learning_records 数据库协议。"
    risk: "展示模型只服务页面，不要把 Rust 返回协议或 Tauri invoke 塞入本文件。"

  - path: "src/types/learningRecord.ts"
    purpose: "Rust LearningRecord 与 LearningRecordPage camelCase 返回协议的 TypeScript 类型。"
    status: "active"
    read_when:
      - "Rust learning_records command 返回字段发生变化。"
      - "排查记忆页分页、单条详情或 ExplanationCard 协议映射。"
    notes: "直接复用 QueryType、SourceType 和 ExplanationCard 判别联合；字段名与 Rust serde camelCase 协议一致。"
    risk: "协议变化时必须同步 Rust 类型、前端类型、repository 和映射。"

  - path: "src/memoryRepository.ts"
    purpose: "记忆页 Tauri commands repository 边界。"
    status: "active"
    read_when:
      - "调整记忆页 list/search/get command 调用。"
      - "排查关键词、queryType 或分页参数是否下推后端。"
    notes: "TauriMemoryRepository 根据关键词选择 list_learning_records 或 search_learning_records，并通过 get_learning_record 读取详情；不暴露 SQL。"
    risk: "不要在 repository 中加入页面展示逻辑，也不要把搜索改为前端全量过滤。"

  - path: "src/memoryService.ts"
    purpose: "LearningRecord/ExplanationCard 到 MemoryRecordItem 的真实数据映射与记忆业务服务。"
    status: "active"
    read_when:
      - "调整四类解释卡在记忆页的字段映射。"
      - "调整真实来源应用、时间分组或详情读取。"
    notes: "按本地日期分为今天/昨天/更早；来源优先使用 sourceApp，缺失时只按真实 sourceType 标记；正式映射不生成过去出现次数。"
    risk: "不得补造后端缺失的语境义、翻译、难度或重复出现聚合。"

  - path: "src/memoryPageFixture.ts"
    purpose: "记忆页浏览器预览与测试专用 fixture。"
    status: "preview-only"
    read_when:
      - "维护浏览器预览或前端测试样本。"
    notes: "只保存四类页面样本和预览用过去出现数据；由非 Tauri 预览数据源读取。"
    risk: "不得把该数据源装配到正式 Tauri 路径，也不得用它冒充真实 SQLite 记录。"

  - path: "src/memoryPreviewService.ts"
    purpose: "浏览器预览与测试专用 MemoryService 实现。"
    status: "preview-only"
    read_when:
      - "维护浏览器预览中的记忆页搜索、筛选或分页。"
    notes: "由 App 仅在非 Tauri 运行时动态加载；正式 Tauri MemoryService 不导入或调用本文件。"
    risk: "前端过滤只允许用于 fixture 预览或测试，不能替代 Rust 搜索 command。"

  - path: "src/styles/main-app.css"
    purpose: "正常主应用全局外壳、侧栏、“今天”和“记忆”内容区的局部视觉样式。"
    status: "active"
    read_when:
      - "调整 readray-today-2 主应用视觉、响应式布局或侧栏状态。"
