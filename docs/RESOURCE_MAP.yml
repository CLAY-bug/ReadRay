project:
  name: "ReadRay"
  description: "Windows 优先的本地英语学习 Agent"
  repo_root: "."

meta:
  version: "1.66"
  last_updated: "2026-08-13"
  updated_by: "Codex"
  source_of_truth: "docs/RESOURCE_MAP.yml"
  language: "zh-CN"

reading_policy:
  default_sequence:
    - "AGENTS.md"
    - "docs/RESOURCE_MAP.yml"
    - "只读取当前任务需要的文件"
  avoid:
    - "除非正在准备比赛材料，否则不要一次性读取 resource/ 下所有文件。"
    - "没有明确原因时，不要扫描整个仓库。"
    - "当本地文档已经记录决策时，不要从聊天历史里重建项目决策。"

core_docs:
  - path: "AGENTS.md"
    purpose: "Codex 协作规则和启动流程。"
    status: "active"
    read_when:
      - "开始新的 Codex 会话。"
      - "不确定项目约定。"
      - "需要判断是否添加流程、依赖或架构。"
    notes: "只记录会改变 Codex 行为的规则；背景信息、阶段计划和技术细节放到 docs/。"
    risk: "不要把临时想法、宽泛口号或不会改变行为的规则塞进本文件。"

  - path: "README.md"
    purpose: "面向仓库访问者的项目概览、当前能力、架构边界、开发命令和文档入口。"
    status: "active"
    read_when:
      - "需要快速了解 ReadRay 已实现的产品能力。"
      - "准备本地运行、执行自动验证或寻找权威文档入口。"
      - "阶段状态或公开项目说明发生变化。"
    notes: "保持简洁并与 DEVELOPMENT_PLAN/HANDOFF 的当前阶段一致；只提供公开概览，不复制完整资源地图或交接记录。"
    risk: "README 不是阶段计划或验收证据；不得写入 API Key、本机绝对路径或尚未实现的功能。"

  - path: "docs/DEVELOPMENT_PLAN.md"
    purpose: "项目定位、技术栈、核心原则、阶段计划和风险说明。"
    status: "active"
    read_when:
      - "讨论路线、技术栈、产品范围、MVP 或比赛策略。"
      - "决策桌面能力接入、Agent 层、SQLite、LLM 供应商。"
      - "规划新的实现阶段。"
    notes: "项目方向、技术栈和阶段计划以本文件为准。"
    risk: "不要从聊天历史恢复已被本文件覆盖的旧决策。"

  - path: "docs/HANDOFF.md"
    purpose: "当前状态快照、已确认决策、下一步和当前已知限制。"
    status: "active"
    read_when:
      - "继续上一次开发。"
      - "需要了解当前状态、下一步或当前已知限制。"
      - "任务产生交接价值，需要更新当前状态快照。"
    notes: "只记录会影响下一次恢复上下文的信息；开头 TL;DR 用于新会话快速恢复。"
    risk: "不要把小型措辞、格式调整或已经能从文件本身看出的变化写成流水账。"

  - path: "docs/WINDOWS_ENVIRONMENT.md"
    purpose: "Windows 开发环境、VS Build Tools 修复经验、验证命令和磁盘占用策略。"
    status: "active"
    read_when:
      - "排查 Tauri Windows 开发环境。"
      - "处理 MSVC、Windows SDK、Rust、Cargo 或 VS Build Tools 问题。"
      - "评估 C 盘空间压力、缓存迁移或 VS Build Tools 重装到 D 盘。"
      - "在 Codex 中运行 pnpm 构建、启动 Tauri dev 或发布到 GitHub。"
    notes: "记录可复用环境经验和本机命令/发布基线，不写成每次操作流水账；已有基线应优先复用，不要先走通用工具探测。"
    risk: "不要手动移动 VS 或 SDK 目录；迁移前先确认安装器、缓存和 Junction 策略。"

  - path: "docs/AGENT_UPGRADE.md"
    purpose: "ReadRay 内置 Agent 体验升级（流式输出、Markdown 渲染、系统提示词）的任务书、已确认决策与验收标准。"
    status: "active"
    read_when:
      - "执行或验收流式输出、对话页 Markdown 渲染、系统提示词构建任务。"
      - "恢复内置 Agent 升级的上下文或核对已确认决策。"
    notes: "执行顺序已确认：先流式输出 → 再 Markdown 渲染 → 最后专门讨论系统提示词构建。任务 1 流式输出、任务 2 对话页 Markdown 渲染、任务 3 系统提示词构建均已验收通过（2026-08-07）。系统提示词已重构为组合式分节构建（quick_ai_prompt.rs）。已确认决策包括本轮不实现记忆注入、重新生成沿用覆盖式语义。后续任务（记忆注入、重新生成、超 8K 续写）在任务书未决区登记。"
    risk: "任务书不是阶段计划；本文件不改变 DEVELOPMENT_PLAN 的阶段边界。阶段八已完成，长期学习者记忆、记忆注入和个性化排序属于阶段九。"

  - path: "doc/quick-ai-overlay-upgrade-task.md"
    purpose: "Quick AI 浮层尺寸、外壳、输入密度、会话恢复、返回与历史导航的顺序任务书。"
    status: "active"
    read_when:
      - "执行或验收 Quick AI 浮层体验升级。"
      - "恢复本轮 Quick AI 交互优化上下文。"
    notes: "严格一次只执行一个任务；任务 1～6 已通过用户验收。任务 7 自动回归已通过，当前只等待真实 Tauri 视觉与交互验收；验收前不得把任务 7 标为完成或进入后续工作。任务 6 经用户确认允许最小修改主窗口统一历史，并为既有会话表增加创建来源字段。"
    risk: "除任务 6 已明确的主窗口历史来源展示和 SQLite 来源字段外，不得扩展到选区解释浮层、模型能力、第二套会话存储或未规划功能。"

  - path: "doc/selection-translation-optimization-task.md"
    purpose: "Ctrl+Alt+U 划词查询的 DeepSeek 快路径、最小上下文、取消、中文反查、规范英文学习目标和本地缓存分阶段任务书。"
    status: "active"
    read_when:
      - "实现或验收划词解释速度优化。"
      - "排查 DeepSeek reasoning 报错、划词长等待或迟到结果落库。"
      - "修复中文查询进入记忆、今天或复习页面。"
    notes: "本轮划词优化已于 2026-08-12 正式收口：任务 1～4 已完成实现、必要验证和用户真实使用验收；任务 4 SQLite v18 精确缓存与 single-flight 已合回主项目。原任务 5 不包含新功能，基于投入产出不再单独执行，其跨模块完整回归清单仅保留为未来正式发布、参赛演示打包或相关模块大改时的检查参考，不得记作已运行。已确认 ExplanationCard 关闭 thinking、纯中文直接译英文、不做质量/Provider 对照测评、不增加深入理解、不维护滚动会话。"
    risk: "不得照搬整页翻译批处理或 Google 非公开接口，不得把 queryText 覆盖成译文；原始学习事件保持追加式，规范英文目标通过正式持久化投影提供给页面。"

  - path: "docs/THEME_PROTOCOL.md"
    purpose: "ReadRayThemeV1 的 manifest、语义颜色、回退、安全解析、持久化和外部 adapter 边界。"
    status: "active"
    read_when:
      - "创建、导入或排查 ReadRay 主题包。"
      - "以后设计 Codex、Obsidian 或其他外部主题 adapter。"
    notes: "ReadRayThemeV1 是唯一稳定内部协议；theme.css 永远只作为文本解析，当前只内置 ReadRay Default 浅色模式。"
    risk: "不得为兼容外部主题开放任意 CSS、布局、字体、图片、远程资源或网络下载。"

competition_resources:
  directory: "resource/"
  status: "active"
  read_when:
    - "准备比赛文档。"
    - "检查提交要求。"
    - "写作品简介、项目文档或演示脚本。"
    - "比较 ReadRay 与官方赛题要求。"
  notes: "2026-06-22 已从大赛官网重新恢复页面、附件和文本抽取；如涉及官方日期和规则，仍以官网当前页面为准。"
  files:
    - path: "resource/official_2026_topics_and_submission.md"
      purpose: "官方赛题页抽取文本，包含开放赛题、地方赛题、华为赛题和附件链接。"
      status: "active"
      notes: "用于赛题方向判断。"
      risk: "若涉及官方日期和规则，必要时重新核对官网。"

    - path: "resource/official_2026_invitation_and_rules.md"
      purpose: "官方邀请函/规则页抽取文本，包含参赛方式、赛程和奖项设置。"
      status: "active"
      notes: "用于规则、赛程和参赛对象确认。"
      risk: "若比赛官网更新，以官网当前页面为准。"

    - path: "resource/official_2026_homepage.md"
      purpose: "赛事主页抽取文本。"
      status: "active"
      notes: "用于补充主页入口、赛程和通知列表信息。"
      risk: "不要用它替代附件中的提交规范。"

    - path: "resource/attachment1_initial_submission_spec.txt"
      purpose: "初赛作品提交规范文本。"
      status: "active"
      notes: "查询作品简介、项目文档、视频、ZIP、截止时间等提交格式时优先读取。"
      risk: "PDF 原件同目录保留；如文本有抽取疑问，回看 PDF。"

    - path: "resource/attachment2_project_document_template.txt"
      purpose: "项目文档模板文本。"
      status: "active"
      notes: "写项目文档结构时优先读取。"
      risk: "模板字段应服务于 ReadRay 叙事，不要机械填充。"

    - path: "resource/attachment3_huawei_topics.txt"
      purpose: "华为赛题细则文本。"
      status: "active"
      notes: "用于判断是否需要兼报或对照华为赛题。"
      risk: "当前 ReadRay 主线不按华为专项推进。"

    - path: "resource/invitation_attachment1_participant_guide.txt"
      purpose: "参赛指南文本。"
      status: "active"
      notes: "用于资格、流程、奖项和组织要求确认。"
      risk: "与官网页面冲突时重新核对官方来源。"

    - path: "resource/invitation_attachment2_invitation_letter.txt"
      purpose: "邀请函盖章版抽取文本。"
      status: "active"
      notes: "用于补充官方通知口径。"
      risk: "该 PDF 抽取曾有字体警告；需要精确引用时回看 PDF。"

    - path: "resource/readray_competition_analysis.md"
      purpose: "前期比赛分析和 ReadRay 定位建议。"
      status: "active"
      notes: "用于快速回顾比赛建议、MVP、风险和路线。"
      risk: "这是综合分析，不替代官方附件。"

source_areas:
  - path: "index.html"
    purpose: "主窗口 React 挂载前的静态品牌启动层与关键样式入口。"
    status: "active"
    read_when:
      - "调整主窗口启动空白、品牌图标、首帧过渡或透明窗口背景。"
    notes: "仅 URL 参数 view=main 时显示静态品牌层；背景使用与正式图标深色底座一致的 #141412，使图标底座融入整屏，图标按 132～176px 响应式显示。标记脚本、关键样式和图片节点都位于 React 模块之前，因此无需等待主题 IPC 或组件挂载。React 首帧就绪后由 startupBrand.ts 添加 rr-main-ready，并以 160ms 透明度过渡移除；无强制最短展示时间。"
    risk: "不要把启动层扩展到 overlay，也不要让图片、动画或后台数据加载阻塞 React；开机启动仍由 Rust 保持主窗口隐藏。"

  - path: "src/startupBrand.ts"
    purpose: "主窗口首帧完成后的静态品牌启动层就绪标记。"
    status: "active"
    read_when:
      - "修改主窗口启动层的移除时机或首帧行为。"
    notes: "MainAppWindow 在 requestAnimationFrame 中调用 markMainStartupReady；模块只负责添加 rr-main-ready 类，不负责计时、数据加载或窗口显示。"
    risk: "不要等待业务请求后再移除启动层；异常路径不应通过第二个 Tauri 窗口制造焦点或任务栏切换。"

  - path: "public/branding/readray-startup-icon.png"
    purpose: "随前端打包的 256×256 RGBA 主窗口启动品牌图标。"
    status: "active"
    read_when:
      - "替换启动品牌图标或检查打包后的静态资源。"
    notes: "由 assets/branding/readray-icon-master.png 通过 Tauri 图标生成链路派生，与任务栏、托盘和安装包图标保持同一母版。"
    risk: "替换后必须确认 dist/branding 中仍有该文件，并在真实 Tauri 主窗口检查深色背景下的视觉尺寸。"

  - path: "assets/branding/"
    purpose: "ReadRay 图标概念原稿、光学收边后的正式母版和资产说明。"
    status: "active"
    read_when:
      - "调整应用图标视觉尺寸、重新生成 Tauri 图标或追溯品牌原稿。"
    notes: "readray-icon-master.png 是当前生成源；2026-08-13 在不重绘内部图形的前提下收紧透明安全边距，使小尺寸任务栏和托盘图标约放大 4%。"
    risk: "不要直接逐个手改 src-tauri/icons 下的派生尺寸；应从正式母版一次性重生成并检查 16/24/32/48/64/256px。"

  - path: "src/"
    purpose: "React 前端源码。"
    status: "active"
    read_when:
      - "开发解释卡、历史页、写作页、复盘页、设置页。"
    notes: "Tauri + Vite + React + TypeScript 脚手架入口；App.tsx 按 URL 区分 main 与 overlay：main 只装配主应用窗口控制，默认入口继续承载 Ctrl+Alt+R 无选区解释、Quick AI 和 UIA 锚定卡链路。ExplanationCard 的 manual/anchored 请求通过 explanationRequestAuthority 以实例级随机 nonce + sequence 分作用域生成 requestKey，编辑、隐藏、切换模式和卸载会使旧 key 失效并调用 Rust 取消，只有当前 key 可通知学习记录刷新。主应用在 App 层同时装配 ReviewPreparationCoordinator 与 ReviewQualityCoordinator，两者都跨 ReviewPage 卸载存活；装配层向外壳注入 ReviewService、后台预热控制器与两个协调器。ReviewQualityCoordinator 通过 DesktopSaveCoordinator mutation gate 拒绝退出期间的新反馈，并注册应用级 flush 供安全退出等待。"
    risk: "不要在前端入口塞入原生系统逻辑，也不要让复习质量反馈协调器回到页面本地生命周期。"

  - path: "src/explanationRequestAuthority.js"
    purpose: "Overlay ExplanationCard 的 manual/anchored 分作用域 requestKey、取消和迟到结果守卫。"
    status: "active"
    read_when:
      - "修改 ExplanationCard 请求、取消或迟到结果生命周期。"
    notes: "零依赖纯状态模块；生产默认使用 crypto.randomUUID（缺失时使用原生 getRandomValues）生成经白名单和长度校验的实例 nonce，requestKey 格式为 scope:nonce:sequence，使旧实例迟到 cancel 与新实例 key 隔离。新请求取消同作用域旧 key，invalidateAll 用于隐藏、模式切换和卸载，失败完成后新 key 可重试。App 仍负责调用 typed Tauri command，Rust 才是落库权威。"
    risk: "前端守卫不能替代 Rust 可取消 future 与保存前权威检查；manual/anchored 不得互相误取消。"

  - path: "tests/explanationRequestAuthority.test.mjs"
    purpose: "ExplanationCard 前端 requestKey、取消、作用域隔离、迟到和失败重试聚焦测试。"
    status: "active"
    read_when:
      - "修改 explanationRequestAuthority 或 App 的 ExplanationCard 请求生命周期。"
    notes: "由 test:overlay 运行；覆盖独立 authority 实例首 key 隔离、旧实例迟到 invalidate、nonce 校验、A→B、manual/anchored 隔离、编辑/隐藏/模式切换/卸载、失败重试和稳定取消分类。"
    risk: "纯状态和静态装配测试不替代真实 Tauri invoke、窗口失焦与 UIA 人工验收。"

  - path: "src/components/MainAppShell.tsx"
    purpose: "ReadRay 正常主应用的无边框外壳、标题栏和内容页装配边界。"
    status: "active"
    read_when:
      - "调整正常主应用壳、标题栏、侧栏折叠或首页装配。"
      - "将主应用接入独立 Tauri 窗口。"
    notes: "当前通过 ?view=main 进入主应用，并在同一外壳内切换“今天”“复习”“写作”“记忆”“对话”“全部对话”和“设置”；由装配层加载 TodayService、ReviewService、MemoryService、ConversationService、WritingService、SettingsService 与最近 Quick AI 对话，页面组件不直接读取数据库。侧栏和全部历史的右键管理统一由外壳装配，成功后复用既有刷新令牌同步列表；只有实时页面、请求键和目标 ID 仍匹配时才同步当前标题或删除后进入空会话。复习来源可按 learningRecordId 进入记忆详情；写作页保持挂载并在离开时隐藏，使失败草稿仍可返回重试。外壳在应用四周渲染 8 个方向的自定义 resize 手柄（.rr-main-resize-handle），透明窗口下替代系统 resize 命中区，mousedown 经 onStartResize 调用前端 getCurrentWindow().startResizeDragging。"
    risk: "不要把快捷 overlay 状态机或 invoke 迁入页面组件；正式 Tauri 对话、复习、写作和设置必须使用真实 service。"

  - path: "src/components/MainSidebar.tsx"
    purpose: "主应用全局左侧栏，包含新对话、学习导航、最近对话、查看全部和设置入口。"
    status: "active"
    read_when:
      - "调整主应用导航结构、最近对话展示、手动折叠态或侧边栏宽度拖拽。"
    notes: "默认宽 252px，用户可拖拽调整；手动折叠后主内容完全铺开，左缘 hover 临时显示侧栏，移开自动隐藏，点击标题栏按钮恢复固定侧栏。展开态最近对话来自真实主窗口会话标题，并支持 loading/error/retry；列表为空时不显示冗余空状态，只保留查看全部入口。最近项左键打开，右键把数据库 ID 和标题交给统一的会话管理菜单；不维护常驻操作按钮。侧边栏右缘提供 180–360px 的拖拽调整手柄，折叠态隐藏手柄。"
    risk: "组件只消费装配层数据；最近对话和查看全部入口不得自行读取 SQLite 或维护第二份会话事实。"

  - path: "src/components/TodayPage.tsx"
    purpose: "主应用首页“今天”的摘要、学习入口和底部输入框。"
    status: "active"
    read_when:
      - "调整今天页内容层级、学习入口或首页输入交互。"
    notes: "消费 TodayService 映射后的本机日期、今日学习记录事实与状态；最近记录可进入记忆详情，写作入口继续进入文章库，输入框通过 callback 进入完整对话页。"
