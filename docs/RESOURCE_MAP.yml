    notes: "复制为 .env 后填写本机密钥；.env 不提交。Tauri 启动时由 Rust dotenvy 从项目根目录加载 .env。"
    risk: "不要把真实 DEEPSEEK_API_KEY 写入该文件或任何提交文件。"

