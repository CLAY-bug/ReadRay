project:
  name: "ReadRay"
  description: "Windows 优先的本地英语学习 Agent"
  repo_root: "."

meta:
  version: "1.13"
  last_updated: "2026-08-02"
  updated_by: "Codex"
  source_of_truth: "docs/RESOURCE_MAP.yml"
  language: "zh-CN"

reading_policy:
  default_sequence:
    - "AGENTS.md"
    - "docs/RESOURCE_MAP.yml"
    - "只读取当前任务需要的文件"
  avoid:
    - "除非正在准备比赛材料，否则不要一次性读取 resource/ 下所有文件。"
    - "没有明确原因时，不要扫描整个仓库。"
    - "当本地文档已经记录决策时，不要从聊天历史里重建项目决策。"

core_docs:
  - path: "AGENTS.md"
    purpose: "Codex 协作规则和启动流程。"
    status: "active"
    read_when:
      - "开始新的 Codex 会话。"
      - "不确定项目约定。"
      - "需要判断是否添加流程、依赖或架构。"
    notes: "只记录会改变 Codex 行为的规则；背景信息、阶段计划和技术细节放到 docs/。"
    risk: "不要把临时想法、宽泛口号或不会改变行为的规则塞进本文件。"

  - path: "docs/DEVELOPMENT_PLAN.md"
    purpose: "项目定位、技术栈、核心原则、阶段计划和风险说明。"
    status: "active"
    read_when:
      - "讨论路线、技术栈、产品范围、MVP 或比赛策略。"
      - "决策桌面能力接入、Agent 层、SQLite、LLM 供应商。"
      - "规划新的实现阶段。"
    notes: "项目方向、技术栈和阶段计划以本文件为准。"
    risk: "不要从聊天历史恢复已被本文件覆盖的旧决策。"

  - path: "docs/HANDOFF.md"
    purpose: "当前状态快照、已确认决策、下一步、待解决问题。"
    status: "active"
    read_when:
      - "继续上一次开发。"
      - "需要了解当前状态、下一步或待解决问题。"
      - "任务产生交接价值，需要更新当前状态快照。"
    notes: "只记录会影响下一次恢复上下文的信息；开头 TL;DR 用于新会话快速恢复。"
    risk: "不要把小型措辞、格式调整或已经能从文件本身看出的变化写成流水账。"

  - path: "docs/WINDOWS_ENVIRONMENT.md"
    purpose: "Windows 开发环境、VS Build Tools 修复经验、验证命令和磁盘占用策略。"
    status: "active"
    read_when:
      - "排查 Tauri Windows 开发环境。"
      - "处理 MSVC、Windows SDK、Rust、Cargo 或 VS Build Tools 问题。"
      - "评估 C 盘空间压力、缓存迁移或 VS Build Tools 重装到 D 盘。"
      - "在 Codex 中运行 pnpm 构建、启动 Tauri dev 或发布到 GitHub。"
    notes: "记录可复用环境经验和本机命令/发布基线，不写成每次操作流水账；已有基线应优先复用，不要先走通用工具探测。"
    risk: "不要手动移动 VS 或 SDK 目录；迁移前先确认安装器、缓存和 Junction 策略。"

competition_resources:
  directory: "resource/"
  status: "active"
  read_when:
    - "准备比赛文档。"
    - "检查提交要求。"
    - "写作品简介、项目文档或演示脚本。"
    - "比较 ReadRay 与官方赛题要求。"
  notes: "2026-06-22 已从大赛官网重新恢复页面、附件和文本抽取；如涉及官方日期和规则，仍以官网当前页面为准。"
  files:
    - path: "resource/official_2026_topics_and_submission.md"
      purpose: "官方赛题页抽取文本，包含开放赛题、地方赛题、华为赛题和附件链接。"
      status: "active"
      notes: "用于赛题方向判断。"
      risk: "若涉及官方日期和规则，必要时重新核对官网。"

    - path: "resource/official_2026_invitation_and_rules.md"
      purpose: "官方邀请函/规则页抽取文本，包含参赛方式、赛程和奖项设置。"
      status: "active"
      notes: "用于规则、赛程和参赛对象确认。"
      risk: "若比赛官网更新，以官网当前页面为准。"

    - path: "resource/official_2026_homepage.md"
      purpose: "赛事主页抽取文本。"
      status: "active"
      notes: "用于补充主页入口、赛程和通知列表信息。"
      risk: "不要用它替代附件中的提交规范。"

    - path: "resource/attachment1_initial_submission_spec.txt"
      purpose: "初赛作品提交规范文本。"
      status: "active"
      notes: "查询作品简介、项目文档、视频、ZIP、截止时间等提交格式时优先读取。"
      risk: "PDF 原件同目录保留；如文本有抽取疑问，回看 PDF。"

    - path: "resource/attachment2_project_document_template.txt"
      purpose: "项目文档模板文本。"
      status: "active"
      notes: "写项目文档结构时优先读取。"
      risk: "模板字段应服务于 ReadRay 叙事，不要机械填充。"

    - path: "resource/attachment3_huawei_topics.txt"
      purpose: "华为赛题细则文本。"
      status: "active"
      notes: "用于判断是否需要兼报或对照华为赛题。"
      risk: "当前 ReadRay 主线不按华为专项推进。"

    - path: "resource/invitation_attachment1_participant_guide.txt"
      purpose: "参赛指南文本。"
      status: "active"
      notes: "用于资格、流程、奖项和组织要求确认。"
      risk: "与官网页面冲突时重新核对官方来源。"

    - path: "resource/invitation_attachment2_invitation_letter.txt"
      purpose: "邀请函盖章版抽取文本。"
      status: "active"
      notes: "用于补充官方通知口径。"
      risk: "该 PDF 抽取曾有字体警告；需要精确引用时回看 PDF。"

    - path: "resource/readray_competition_analysis.md"
      purpose: "前期比赛分析和 ReadRay 定位建议。"
      status: "active"
      notes: "用于快速回顾比赛建议、MVP、风险和路线。"
      risk: "这是综合分析，不替代官方附件。"

source_areas:
  - path: "src/"
    purpose: "React 前端源码。"
    status: "active"
    read_when:
      - "开发解释卡、历史页、写作页、复盘页、设置页。"
    notes: "Tauri + Vite + React + TypeScript 脚手架入口；App.tsx 按 URL 区分 main 与 overlay：main 只装配主应用窗口控制，默认入口继续承载 Ctrl+Alt+R 无选区解释、Quick AI 和 UIA 锚定卡链路。"
    risk: "不要在前端入口塞入原生系统逻辑。"

  - path: "src/components/MainAppShell.tsx"
    purpose: "ReadRay 正常主应用的无边框外壳、标题栏和内容页装配边界。"
    status: "active"
    read_when:
      - "调整正常主应用壳、标题栏、侧栏折叠或首页装配。"
      - "将主应用接入独立 Tauri 窗口。"
    notes: "当前通过 ?view=main 进入主应用，并在同一外壳内切换“今天”“写作”“记忆”和“对话”；由装配层加载 TodayService、MemoryService、ConversationService、WritingService 与最近 Quick AI 对话，页面组件不直接读取数据库。写作页保持挂载并在离开时隐藏，使失败草稿仍可返回重试。"
    risk: "不要把快捷 overlay 状态机或 invoke 迁入页面组件；正式 Tauri 对话和写作必须使用真实 service，fixture 只能由非 Tauri 预览动态加载。"

  - path: "src/components/MainSidebar.tsx"
    purpose: "主应用全局左侧栏，包含新对话、学习导航、最近对话、查看全部和设置入口。"
    status: "active"
    read_when:
      - "调整主应用导航结构、最近对话展示或手动折叠态。"
    notes: "默认宽 252px，用户手动折叠为 72px 纯图标栏；展开态最近对话来自真实 Quick AI 标题，并支持 loading/empty/error/retry。"
    risk: "组件只消费装配层数据；最近对话点击可加载真实正文，但查看全部、删除和重命名仍属于后续阶段。"

  - path: "src/components/TodayPage.tsx"
    purpose: "主应用首页“今天”的摘要、学习入口和底部输入框。"
    status: "active"
    read_when:
      - "调整今天页内容层级、学习入口或首页输入交互。"
    notes: "消费 TodayService 映射后的本机日期、今日学习记录事实与状态；最近记录可进入记忆详情，写作入口继续进入文章库，输入框通过 callback 进入完整对话页。"
    risk: "不要在本组件调用 invoke/SQLite，不得显示待复习、高频词或趋势推断；输入只负责把 prompt 交给正式 ConversationService。"

  - path: "src/components/ConversationPage.tsx"
    purpose: "主应用完整对话页的消息流、输入、长提示折叠、生成状态、操作菜单和记忆引用抽屉。"
    status: "active"
    read_when:
      - "调整完整对话页布局、消息展示或设计稿交互。"
      - "接入真实 Quick AI 历史、发送、导出或记忆引用。"
    notes: "复用 MainAppShell、MainSidebar 和全局标题栏；页面只消费 ConversationService。正式 Tauri 回答以 SQLite 权威快照回写，加载到以 user 结尾的会话时恢复明确的 pending 重试态；非 Tauri fixture 继续演示分片、停止、重生成和导出。"
    risk: "不得在页面组件直接调用 Tauri、SQLite 或 DeepSeek；真实后端不支持的停止、重生成、导出和记忆引用必须保持禁用或无数据状态。"

  - path: "src/conversationViewModel.ts"
    purpose: "完整对话页的有类型消息、富文本块、记忆引用、入口请求和可替换 service 协议。"
    status: "active"
    read_when:
      - "调整对话页展示协议或替换真实对话 service。"
    notes: "页面只消费 ConversationThread 与 ConversationService，不复制 Rust Quick AI 数据库 schema；消息可携带真实 sequence，thread 可携带由尾部 user 推导的 pendingTurn，生成结果区分 complete 与已持久化 pending。"
    risk: "协议变化必须同步真实 service 与 fixture；不能让 Rust 原始响应直接耦合组件。"

  - path: "src/conversationRepository.ts"
    purpose: "完整对话页的 Tauri Quick AI command repository。"
    status: "active"
    read_when:
      - "调整完整对话创建、读取或发送 command 调用。"
      - "排查 Tauri 参数名或 Rust camelCase 返回协议。"
    notes: "只调用现有 create_quick_ai_conversation、get_quick_ai_conversation 与 send_quick_ai_message；发送显式携带 conversationId、expectedUserSequence 与 content，不包含页面映射或第二套存储。"
    risk: "不得在 repository 拼装上下文、复制 SQLite schema 或另建模型客户端。"

  - path: "src/conversationService.ts"
    purpose: "Rust Quick AI 会话到现有完整对话页面模型的映射与正式 service。"
    status: "active"
    read_when:
      - "调整真实会话加载、续聊、失败重试或页面消息映射。"
      - "排查正式能力降级和最近对话刷新。"
    notes: "以 Rust 返回的 ConversationSnapshot 为权威；用 conversationId + expectedUserSequence 标识轮次，不靠 prompt 文本猜测完成状态。发送失败时读取数据库恢复 completed 或 pending；若 IPC 与读取都失败，页面仍保留同一 expected sequence，下一次重试由后端幂等返回。"
    risk: "不得使用前端 messages 重建后端历史；多轮上下文只由现有 Quick AI/SQLite 事实提供。"

  - path: "tests/conversationService.test.mjs"
    purpose: "完整对话 Tauri repository 参数、Rust 快照映射和关键失败恢复测试。"
    status: "active"
    read_when:
      - "修改 conversation repository/service 协议或失败重试语义。"
    notes: "使用 Node 内置 test runner 与注入式 repository，不新增测试依赖；覆盖 9 项参数映射、pending 恢复、重启重试、模糊成功路径和正式能力降级。"
    risk: "这些测试不替代真实 Tauri/DeepSeek 人工验收。"

  - path: "src/conversationFixtureService.ts"
    purpose: "对话页非 Tauri 浏览器预览使用的有类型 fixture service。"
    status: "preview-only"
    read_when:
      - "维护设计稿示例对话、生成/失败/重试状态或前端预览。"
    notes: "支持新对话、六类设计示例、未知最近标题降级、前端流式回答和包含完整 thread 的 Markdown 导出文件；conversationFailure=create|load|generate|export 提供一次性显式故障注入，[fixture:slow] 只用于停止/继续验证。"
    risk: "该 service 不持久化 thread、不读取真实历史，也不请求 DeepSeek；不得由正式 Tauri 装配读取或实例化。"

  - path: "src/components/MemoryPage.tsx"
    purpose: "主应用“记忆”页的搜索、类型筛选、记录列表、详情和过去出现交互骨架。"
    status: "active"
    read_when:
      - "调整记忆页内容布局、筛选、选择或历史展开交互。"
      - "将记忆页 fixture 接入现有 learning_records Rust commands。"
    notes: "复用 MainAppShell、MainSidebar 和标题栏；通过装配层注入的 MemoryService 读取真实分页列表与单条详情，搜索和四类筛选均下推 Rust commands；保留键盘导航和 980px 以下列表/详情切换。"
    risk: "不要复制第二套 App Shell，不要在页面组件直接调用 Tauri、读取 SQLite 或退回全量前端过滤。"

  - path: "src/components/WritingPage.tsx"
    purpose: "主应用“写作”页的文档工作流与状态装配边界。"
    status: "active"
    read_when:
      - "调整写作草稿、检查、对比、完成稿或文章库状态流。"
      - "调整正式写作 repository/service 状态、保存竞态或失败重试。"
    notes: "复用 MainAppShell、MainSidebar 和标题栏；只消费 WritingService。新建、搜索、加载、删除、自动保存、检查、真实问答、完成版本与继续修改均以 Rust/SQLite 返回的 ID、revision 和时间为权威；模型请求绑定文章、数据库 revision、可见快照、完成版本 ID、本地编辑 generation 和同目标请求序号。当前草稿辅导会话按文章和最近完成版本边界保持，自动保存推进 revision 不会清除已接受回答或追问身份；问答按时间持续展开，下一问接续最后回答，不再另设“之前的问题”折叠摘要。完成版本仍按 versionId 严格隔离。当前 revision 分析与基线检查分开消费；完成版本切换会重建只读“基线问题/处理回顾”，清理辅助面板并只显示自身固化的问题、模式和问答，不把基线问题重置为待处理状态或在完成稿中定位。已有草稿时“继续修改”提示返回该草稿。页面 hidden 时不接管 Ctrl+J/Escape。"
    risk: "不要复制第二套 App Shell，不要在页面组件直接 invoke、读取 localStorage/SQLite 或重新引入硬编码问题和回答。"

  - path: "src/writingViewModel.ts"
    purpose: "写作模块的页面模型、文章/版本/分析/问答类型和纯展示工具。"
    status: "active"
    read_when:
      - "调整写作页面协议、文章状态或 Rust camelCase 映射。"
    notes: "只包含 WritingSnapshot、WritingDocumentRecord、WritingAnalysis、WritingAgentAnswer 等正式页面类型和快照工具；不再包含示例文章、硬编码问题或演示回答。"
    risk: "保持页面模型边界，不把 LLM 原始响应或 SQLite schema 直接耦合到组件。"

  - path: "src/writingRepository.ts"
    purpose: "写作模块正式 Tauri command repository。"
    status: "active"
    read_when:
      - "调整写作 command 名称、camelCase 参数或 Rust 返回协议。"
    notes: "只调用 create/list/get/save/delete/analyze/ask/complete/continue writing commands；保存、分析、删除和完成均显式携带 expectedRevision，历史完成版本问答额外携带 versionId。原始 payload 类型允许 Rust Option 序列化的 null。"
    risk: "不得在 repository 读取 localStorage、复制 SQLite schema、拼装模型上下文或建立第二套模型客户端。"

  - path: "src/writingService.ts"
    purpose: "写作 Rust 返回协议的运行时校验、深拷贝映射与正式 service。"
    status: "active"
    read_when:
      - "调整真实写作加载、保存、分析、问答、完成或继续修改。"
      - "排查跨文章映射、无效 ID/revision 或空快照。"
    notes: "RepositoryWritingService 校验数据库 ID、revision、时间、文章归属、版本、问题、模式和回答，再把结构化结果交给页面；Rust Option 的 null 统一规范化为 undefined。activeAnalysis 只接受当前 revision，baselineAnalysis 只接受 comparisonBaselineRevision；完成版本允许 sourceRevision 晚于同一基线绑定的 analysisRevision/comparisonBaselineRevision。兼容 legacy 基线 revision 为 null 时，只有 analysisRevision 与 sourceRevision 精确相同才接受。缺失文章和无效协议明确失败。"
    risk: "不得让页面绕过 service 使用 Rust 原始响应，也不得用前端正文重建数据库版本。"

  - path: "src/writingDraftSaveCoordinator.ts"
    purpose: "写作草稿防抖、串行保存、revision 推进、切换 flush 与卸载落盘协调器。"
    status: "active"
    read_when:
      - "调整自动保存延迟、失败重试或文档切换/卸载竞态。"
    notes: "每篇文章独立跟踪数据库 revision 与对应已落盘快照，只保存最新 pending 快照；保存调用失败后读回文章对账：revision 已推进且目标快照一致则确认成功，仍为旧 revision 才允许安全重试。若权威分析只推进一个 revision 且正文仍与送检基线一致，在途 pending 会自动改用新 revision 重试；远端正文不同则保留本地正文并阻止覆盖。切换前可等待 flush，dispose 会尝试落盘且不回写已卸载组件。"
    risk: "不得绕过 expectedRevision；对账不明或内容冲突时不得携带旧 revision 无限重试。"

  - path: "src/writingRequestIdentity.ts"
    purpose: "写作模型请求的可见正文身份与隐藏页面快捷键纯状态守卫。"
    status: "active"
    read_when:
      - "调整迟到分析/回答拒绝、本地编辑 generation 或历史版本身份。"
      - "调整 WritingPage hidden 时的 Ctrl+J/Escape 行为。"
    notes: "请求身份同时包含 documentId、数据库 revision、本地 generation、深拷贝快照和可选 versionId；Promise 返回后必须仍与当前可见身份完全一致才可显示。"
    risk: "不能只比较数据库 revision；防抖尚未落盘的本地编辑也必须使旧模型结果失效。"

  - path: "src/writingReviewState.ts"
    purpose: "写作当前草稿/历史版本的检查状态重建与同目标问答序号守卫。"
    status: "active"
    read_when:
      - "调整 activeAnalysis、基线检查、历史版本问题/回答显示或问答乱序处理。"
